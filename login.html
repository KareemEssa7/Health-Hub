<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Health Hub || Login</title>

    <!-- Page Logo -->
    <link rel="icon" type="image/x-icon" href="Images/Favicon.png" />

    <!-- Font Awesome Page -->
    <link rel="stylesheet" href="Css/all.min.css" />
    <!-- Global Style Page -->
    <link rel="stylesheet" href="Css/global.css" />
    <!-- Main Style Page -->
    <link rel="stylesheet" href="Css/login.css" />
  </head>
  <body>
    <div class="container">
      <a href="home.html" class="home-btn">
        <i class="fa-solid fa-angle-left"></i>
        <span>الرئيسية</span>
      </a>
      <div class="sidebar">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="240"
          height="240"
          viewBox="0 0 24 24"
        >
          <path
            fill="#a7aaae"
            fill-opacity="0.3"
            d="M8.82 11.29a1 1 0 0 0 0 1.42a1 1 0 0 0 1.41 0a1 1 0 0 0 0-1.42a1 1 0 0 0-1.41 0m2.47 2.48a1 1 0 0 0 0 1.41a1 1 0 0 0 1.42 0a1 1 0 0 0 0-1.41a1 1 0 0 0-1.42 0m9-10A6 6 0 0 0 12 3.55a6 6 0 0 0-8.24.2A6 6 0 0 0 3.57 12A6 6 0 0 0 8 22a5.92 5.92 0 0 0 4-1.55a6 6 0 0 0 8.25-.2a6 6 0 0 0 .18-8.25a6 6 0 0 0-.18-8.25Zm-1.46 1.4a4 4 0 0 1 .17 5.39L13.44 5a4.07 4.07 0 0 1 5.39.17M5.17 18.83A4 4 0 0 1 5 13.44l5.6 5.6a4.08 4.08 0 0 1-5.43-.21m13.66 0a4.08 4.08 0 0 1-5.64 0l-8-8a4 4 0 0 1 0-5.64a4 4 0 0 1 5.64 0l8 8a4 4 0 0 1 0 5.64m-5.06-7.54a1 1 0 0 0 0 1.42a1 1 0 0 0 1.41 0a1 1 0 0 0 0-1.42a1 1 0 0 0-1.41 0m-2.48-2.47a1 1 0 0 0 0 1.41a1 1 0 0 0 1.42 0a1 1 0 0 0 0-1.41a1 1 0 0 0-1.42 0"
          />
        </svg>
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="240"
          height="240"
          viewBox="-2 -2 24 24"
        >
          <path
            fill="#a7aaae"
            fill-opacity="0.3"
            d="M7 12.917v.583a4.5 4.5 0 1 0 9 0v-1.67a3.001 3.001 0 1 1 2 0v1.67a6.5 6.5 0 1 1-13 0v-.583A6.002 6.002 0 0 1 0 7V2a2 2 0 0 1 2-2h1a1 1 0 1 1 0 2H2v5a4 4 0 1 0 8 0V2H9a1 1 0 1 1 0-2h1a2 2 0 0 1 2 2v5a6.002 6.002 0 0 1-5 5.917M17 10a1 1 0 1 0 0-2a1 1 0 0 0 0 2"
          />
        </svg>
        <ul>
          <li>
            <a href="login.html" class="active">تسجيل الدخول<span></span></a>
          </li>
          <li><a href="register.html">إنشاء حساب</a></li>
        </ul>
      </div>
      <div class="form">
        <h1>مرحبًا بك من جديد!</h1>
        <p>قم بإدخال بيانات الشخصية و ابدأ رحلتك معنا</p>
        <form action="">
          <div class="inputs">
            <input type="email" placeholder="البريد الإلكتروني" required />
            <i class="fa-solid fa-user"></i>
          </div>
          <div class="inputs">
            <input type="password" placeholder="كلمة المرور" required />
            <i class="fa-solid fa-lock"></i>
          </div>
          <div class="remember">
            <input type="checkbox" name="remember" id="" />
            <span>تذكرنى دائماً</span>
          </div>
          <div class="btns">
            <input type="submit" value="تسجيل الدخول" />
            <a href="passForget.html">هل نسيت كلمة المرور؟</a>
          </div>
        </form>
        <div class="socials">
          <form action="">
            <button class="google">
              <i class="fa-brands fa-google"></i>
              <span>المتابعة عبر جوجل</span>
            </button>
            <button class="facebook">
              <i class="fa-brands fa-facebook"></i>
              <span>المتابعة عبر الفيسبوك</span>
            </button>
          </form>
        </div>
      </div>
    </div>

    <!-- Start Scroll To Top -->
    <span class="scroll-top">
      <i class="fa-solid fa-angle-up"></i>
    </span>
    <!-- End Scroll To Top -->
    
    <!-- Start Language And DarkMode -->
    <div class="setting">
      <i class="fa-solid fa-moon dark-mode"></i>
    </div>

    <div class="lang">
      <i class="fa-solid fa-globe"></i>
      <span class="lang-name">العربية</span>
      <ul class="lang-menu">
        <li class="ar active-lang">العربية</li>
        <li class="en">English</li>
      </ul>
    </div>
    <!-- End Language And DarkMode -->

    <!-- Start Contact Alert -->
    <div class="alert success">
      <span></span>
      <div class="text">
        <i class="fa-regular fa-circle-check"></i>
        تم تسحيل الدخول بنجاح!
      </div>
      <i class="fa-solid fa-xmark exit"></i>
    </div>
    <div class="alert error">
      <span></span>
      <div class="text">
        <i class="fa-solid fa-circle-exclamation"></i>
        من فضلك, ادخل بياناتك كاملة!
      </div>
      <i class="fa-solid fa-xmark exit"></i>
    </div>
    <!-- End Contact Alert -->

    <!-- Login Js File -->
    <script src="JS/login.js"></script>
    <!-- Global Js File -->
    <script src="JS/global.js"></script>
  </body>
</html>
